<!DOCTYPE html><html lang="en"><head><script>try{var h=document.documentElement,l=localStorage;h.dataset.theme=l.getItem('chamber-theme')||'dark';h.dataset.size=l.getItem('chamber-size')||'normal';h.dataset.density=l.getItem('chamber-density')||'cozy'}catch(e){}</script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><title>Your requests · Chamber</title>
<style>
  :root {
    --bg: #0a0c0b; --surface: #101412; --surface-2: #161b18; --line: #232a26; --line-strong: #303934;
    --text: #d8ded9; --text-dim: #8d978f; --text-faint: #5f6964; --dim: var(--text-dim); --faint: var(--text-faint); --surface-3: #1c221e;   /* 2026-11-13: --dim/--faint used to be fixed dark-theme greys, so grey text stayed pale on the Light theme */
    --accent-pick: #00ff88; --accent: var(--accent-pick); --fs: 13px;
    --diff-add-fg: #7ee787; --diff-del-fg: #ffa198; --diff-hunk: #79c0ff; --tok-str: #e0a060; --accent-ink: #04170c; --ok: var(--accent);
    --accent-soft: color-mix(in srgb, var(--accent) 13%, transparent); --accent-line: color-mix(in srgb, var(--accent) 38%, var(--line));
    --danger: #ff6b6b; --warn: #ffab40; --info: #6ab0ff;
    --r: 6px; --r-lg: 10px;
    --mono: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --shadow: 0 12px 40px rgba(0, 0, 0, .55);
    --panel: var(--surface); --panel-solid: var(--surface); --code-bg: var(--surface-2); --code-fg: var(--text);   /* legacy names */
  }
  /* T-0073: themes. data-theme on <html> is set before first paint by the inline script in <head>; 'system' follows the OS. */
  :root[data-theme=light] { --bg: #f4f7f5; --surface: #ffffff; --surface-2: #eef2ef; --surface-3: #e4e9e6; --line: #dbe2de; --line-strong: #c2ccc6;
    --text: #182019; --text-dim: #566159; --text-faint: #7a847e; --accent: color-mix(in srgb, var(--accent-pick) 50%, #000); --accent-ink: #ffffff;
    --danger: #c62828; --warn: #a35f00; --human: #9a5b00; --info: #1e5fb3; --shadow: 0 12px 40px rgba(0, 0, 0, .18);
    --diff-add-fg: #116329; --diff-del-fg: #a40e26; --diff-hunk: #0550ae; --tok-str: #9a4b1e; color-scheme: light; }
  @media (prefers-color-scheme: light) { :root[data-theme=system] { --bg: #f4f7f5; --surface: #ffffff; --surface-2: #eef2ef; --surface-3: #e4e9e6; --line: #dbe2de; --line-strong: #c2ccc6;
    --text: #182019; --text-dim: #566159; --text-faint: #7a847e; --accent: color-mix(in srgb, var(--accent-pick) 50%, #000); --accent-ink: #ffffff;
    --danger: #c62828; --warn: #a35f00; --human: #9a5b00; --info: #1e5fb3; --shadow: 0 12px 40px rgba(0, 0, 0, .18);
    --diff-add-fg: #116329; --diff-del-fg: #a40e26; --diff-hunk: #0550ae; --tok-str: #9a4b1e; color-scheme: light; } }
  :root[data-theme=contrast] { --bg: #000000; --surface: #000000; --surface-2: #121212; --surface-3: #1c1c1c; --line: #5a5a5a; --line-strong: #808080;
    --text: #ffffff; --text-dim: #d6d6d6; --text-faint: #b8b8b8; --accent-soft: color-mix(in srgb, var(--accent) 22%, transparent); --shadow: none; }
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.65 var(--mono);padding:0 16px;-webkit-font-smoothing:antialiased}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:900px;margin:0 auto;padding:14px 0;border-bottom:1px solid var(--line);font-size:13px}
.top .brand{color:var(--accent);font-weight:800;letter-spacing:.18em;text-decoration:none}.top nav{display:flex;gap:16px;flex-wrap:wrap}.top nav a{color:var(--dim);text-decoration:none}.top nav a:hover{color:var(--text)}.top nav a.on{color:var(--accent)}
main{max-width:900px;margin:0 auto;padding:28px 0 60px}h1{color:var(--accent);letter-spacing:.1em;font-size:20px;margin:0 0 6px;text-transform:uppercase}
h2{color:var(--accent);font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin:36px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
h3{font-size:14px;margin:18px 0 6px;color:var(--text)}p,li{color:var(--text)}.dim{color:var(--dim)}a{color:var(--accent)}li{margin:3px 0}
pre{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;overflow:auto;font-size:12.5px;line-height:1.5}code{background:var(--surface-2);border:1px solid var(--line);padding:0 5px;border-radius:4px;font-size:12.5px}pre code{background:none;border:0;padding:0}
nav.toc{display:flex;flex-wrap:wrap;gap:6px 14px;margin:14px 0 0;font-size:13px}nav.toc a{text-decoration:none;color:var(--dim)}nav.toc a:hover{color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:12.5px}td,th{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}th{color:var(--dim);font-weight:normal;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.m{display:inline-block;min-width:44px;font-weight:700;color:var(--info)}.m.post{color:var(--accent)}
footer{color:var(--dim);font-size:12px;border-top:1px solid var(--line);margin-top:40px;padding-top:12px}footer a{color:var(--dim)}kbd{font:inherit;font-size:11px;color:var(--dim);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 5px}
@media(max-width:600px){h1{font-size:18px}.top{flex-direction:column;align-items:flex-start}}
</style></head><body><div class="top"><a class="brand" href="/">CHAMBER</a><nav><a href="/requests" class="on">Your requests</a><a href="/billing">Account</a><a href="/help">Help</a></nav></div>
<main>
<style>
#rq-form label{display:block;font-size:11px;color:var(--dim);margin:14px 0 5px;letter-spacing:.08em;text-transform:uppercase}
#rq-form input,#rq-form textarea{width:100%;box-sizing:border-box;padding:9px 11px;background:var(--bg);border:1px solid var(--line-strong);border-radius:var(--r);color:var(--text);font:inherit;font-size:16px}
#rq-form textarea{resize:vertical;min-height:110px}
.rq-btn{margin-top:14px;height:38px;padding:0 16px;border:1px solid var(--accent);border-radius:var(--r);background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;cursor:pointer}
.rq-btn:disabled{opacity:.6}
.rq{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin:10px 0;background:var(--surface)}
.rq .res{margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.rq-files{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}.rq-files img{max-width:120px;max-height:90px;border-radius:6px;border:1px solid var(--line);display:block}.rq-files a{overflow-wrap:anywhere}
#rq-files{max-width:100%}
.st{display:inline-block;font-size:11px;padding:0 8px;border-radius:999px;border:1px solid var(--line-strong);color:var(--dim);margin-left:6px}
.st.done{color:var(--accent);border-color:var(--accent-line)}.st.rejected{color:var(--danger)}
#rq-msg{display:inline-block;margin-left:10px;font-size:13px}
</style>
<h1>Your requests</h1>
<p class="dim" id="rq-sub">Ask the team for something in plain words, and follow what happens to each of your requests here. A person on the team decides on each request before any work starts.</p>
<h2>New request</h2>
<form id="rq-form">
<label for="rq-title">What do you need?</label>
<input id="rq-title" maxlength="120" required placeholder="For example: add a contact form to the shop page">
<label for="rq-body">Details (optional)</label>
<textarea id="rq-body" rows="5" maxlength="4000" placeholder="Anything that helps: where, why, by when, and how you will know it is done"></textarea>
<label for="rq-files">Pictures or files (optional, up to 3)</label>
<input type="file" id="rq-files" multiple>
<div class="dim" id="rq-files-note"></div>
<button type="submit" class="rq-btn" id="rq-send">Send request</button><span id="rq-msg" role="status"></span>
</form>
<h2>Sent so far</h2>
<div id="rq-list"><p class="dim">Loading your requests.</p></div>
<p class="dim" id="rq-mail-row" hidden><label><input type="checkbox" id="rq-mail"> Email me when one of my requests moves (approved, started, done or not going ahead)</label> <span id="rq-mail-note" role="status"></span></p>
<p class="dim"><a href="/billing">Your account</a> · <a href="/help">Help</a> · <a href="#" id="rq-out">Log out</a></p>
<script>
(() => {                                                                    // T-0199: the page a requester (client, manager) uses
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const when = s => s ? new Date(s).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '';
  let mailSaid = false, maxFiles = 3, maxMb = 10;
  const size = b => b < 1048576 ? Math.max(1, Math.round(b / 1024)) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
  function picked() {                                                        // T-0206: say what will be sent, and what will not fit, before anything is uploaded
    const fs = [...$('rq-files').files], big = fs.filter(f => f.size > maxMb * 1048576);
    const bad = fs.length > maxFiles ? `That is ${fs.length} files; a request takes at most ${maxFiles}.` : big.length ? `${big[0].name} is ${size(big[0].size)}; the limit is ${maxMb} MB for one file.` : '';
    $('rq-files-note').textContent = bad || fs.map(f => `${f.name} (${size(f.size)})`).join(', ');
    return bad ? null : fs;
  }
  $('rq-files').addEventListener('change', picked);
  async function load() {
    let r; try { r = await fetch('/api/requests'); } catch { $('rq-list').innerHTML = '<p class="dim">Could not reach Chamber. It retries in a minute.</p>'; return; }
    if (r.status === 401) { location.href = '/login'; return; }
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { $('rq-list').innerHTML = `<p class="dim">${esc(d.error || 'Could not load your requests.')}</p>`; return; }
    maxFiles = d.max_files || 3; maxMb = d.max_file_mb || 10;                   // T-0206
    const list = d.requests || [], em = d.mail || {};                          // T-0205: the email switch
    $('rq-mail-row').hidden = false; $('rq-mail').checked = em.on !== false; $('rq-mail').disabled = em.set_up === false;
    if (!mailSaid) $('rq-mail-note').textContent = em.set_up === false ? 'This Chamber has no email set up, so none are sent.' : em.confirmed === false && em.on !== false ? 'They start once you confirm your email address: use the link in the email you got when you signed up.' : '';
    $('rq-list').innerHTML = list.length ? list.map(q => `<div class="rq"><div><b>${esc(q.title)}</b><span class="st ${esc(q.status)}">${esc(q.statusText)}</span></div>`
      + `<div class="dim">${esc(q.id)} · sent ${esc(when(q.sent))}${q.finished ? ' · finished ' + esc(when(q.finished)) : ''}</div>`
      + ((q.files || []).length ? `<div class="rq-files">${q.files.map(f => /^image\/(png|jpeg|gif|webp)$/.test(f.mime) ? `<a href="${esc(f.url)}" target="_blank" rel="noopener" title="${esc(f.name)}"><img src="${esc(f.url)}" alt="${esc(f.name)}" loading="lazy"></a>` : `<a href="${esc(f.url)}?download">${esc(f.name)}</a>`).join('')}</div>` : '')
      + (q.result ? `<div class="res">${esc(q.result)}</div>` : '') + (q.reason ? `<div class="res">Reason: ${esc(q.reason)}</div>` : '') + '</div>').join('')
      : '<p class="dim">No requests yet. Your first one appears here as soon as you send it.</p>';
  }
  $('rq-form').addEventListener('submit', async e => {
    e.preventDefault(); $('rq-send').disabled = true; $('rq-msg').textContent = 'Sending…';
    try {
      const fs = picked(); if (!fs) throw new Error($('rq-files-note').textContent);
      const ids = [];
      for (const [i, f] of fs.entries()) {                                       // T-0206: the files first, then the request that names them
        $('rq-msg').textContent = `Adding file ${i + 1} of ${fs.length}…`;
        const u = await fetch('/api/requests/files', { method: 'POST', headers: { 'Content-Type': f.type || 'application/octet-stream', 'X-File-Name': encodeURIComponent(f.name) }, body: f });
        const ud = await u.json().catch(() => ({}));
        if (!u.ok) throw new Error(ud.error || `Could not add ${f.name}. Try again.`);
        ids.push(ud.file.id);
      }
      $('rq-msg').textContent = 'Sending…';
      const r = await fetch('/api/requests', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: $('rq-title').value, body: $('rq-body').value, files: ids }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || 'Could not send it. Try again.');
      $('rq-title').value = ''; $('rq-body').value = ''; $('rq-files').value = ''; $('rq-files-note').textContent = ''; $('rq-msg').textContent = `Sent as ${d.id}. The team can see it now.`; load();
    } catch (err) { $('rq-msg').textContent = err.message; } finally { $('rq-send').disabled = false; }
  });
  $('rq-mail').addEventListener('change', async () => {                      // T-0205
    const on = $('rq-mail').checked; mailSaid = true;
    try { const r = await fetch('/api/requests/mail', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ on }) }); if (!r.ok) throw new Error(); $('rq-mail-note').textContent = on ? 'Emails are on.' : 'Emails are off.'; }
    catch { $('rq-mail').checked = !on; $('rq-mail-note').textContent = 'Could not save that. Try again.'; }
  });
  $('rq-out').addEventListener('click', async e => { e.preventDefault(); try { await fetch('/account/logout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }); } catch {} location.href = '/'; });
  load(); setInterval(load, 60000);
})();
</script>
</main><script src="/theme.js"></script><script>window.ChamberTheme && ChamberTheme.init({ server: false });</script></body></html>
