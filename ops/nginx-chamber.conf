# Chamber reverse proxy (server Claude, 2026-11-06). Chamber itself listens on 127.0.0.1:4242 only.
# Per-visitor login limit: behind nginx Chamber's own throttle sees one address for everybody.
limit_req_zone $binary_remote_addr zone=chamber_login:10m rate=10r/m;
server {
    server_name chamber.ghostporttechnologies.com;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    error_page 502 503 504 /50x.html;                      # chamber-50x: branded "restarting" page while node is down
    location = /50x.html { root /var/www/chamber; internal; add_header Cache-Control no-store; }
    location ~ ^/(account/(login|signup|reset-request)|api/login)$ {
        limit_req zone=chamber_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4242;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /api/events {
        proxy_pass http://127.0.0.1:4242;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
    location / {
        proxy_pass http://127.0.0.1:4242;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 12m;                       # T-0064: file uploads (Chamber itself caps at 10 MB)
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/chamber.ghostporttechnologies.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/chamber.ghostporttechnologies.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


    add_header Strict-Transport-Security "max-age=31536000" always; # managed by Certbot

}

server {
    if ($host = chamber.ghostporttechnologies.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name chamber.ghostporttechnologies.com;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    location ~ ^/(account/(login|signup|reset-request)|api/login)$ {
        limit_req zone=chamber_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4242;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
        proxy_pass http://127.0.0.1:4242;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }




}